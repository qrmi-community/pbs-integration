<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
<marker id="arrRetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
<marker id="arrApi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
</defs>
<rect x="0" y="0" width="1500" height="930" fill="#ffffff"/>

<!-- Quantum Resources -->
<rect x="180" y="22" width="1300" height="62" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="200" y="59" font-size="17" font-weight="bold" fill="#4c1d95">Quantum Resources</text>
<text x="400" y="59" font-size="14" fill="#5b21b6">(e.g. IBM Quantum)  ·  accessed through QRMI with the settings in qrmi_config.json</text>

<!-- Regions -->
<rect x="180" y="110" width="530" height="410" rx="12" fill="#f8fbff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="196" y="138" font-size="16" font-weight="bold" fill="#1e3a8a">pbs-server</text>
<rect x="730" y="110" width="750" height="410" rx="12" fill="#f7fdf9" stroke="#86efac" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="1466" y="508" font-size="16" font-weight="bold" fill="#14532d" text-anchor="end">first compute node of the job (e.g. pbs-node1)</text>

<!-- User -->
<circle cx="80" cy="290" r="16" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<path d="M50,344 Q80,306 110,344 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="80" y="368" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">User</text>
<line x1="114" y1="315" x2="196" y2="315" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="155" y="305" font-size="13" fill="#475569" text-anchor="middle">qsub</text>

<rect x="200" y="165" width="162" height="265" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<circle cx="220" cy="189" r="11" fill="#2563eb"/>
<text x="220" y="194" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="237" y="194" font-size="13.5" font-weight="bold" fill="#1e3a8a">qrmi_validate</text>
<text x="212" y="216" font-size="11.5" fill="#1e40af">queuejob, modifyjob</text>
<g font-size="12.5" fill="#1e3a8a">
<text x="212" y="243" xml:space="preserve">At qsub / qalter:</text>
<text x="212" y="259" xml:space="preserve">checks names, types,</text>
<text x="212" y="275" xml:space="preserve">N, status() of QPUs</text>
<text x="212" y="360" xml:space="preserve">✕ invalid, N > limit,</text>
<text x="212" y="375" xml:space="preserve">  auth error etc.</text>
<text x="212" y="390" xml:space="preserve">  → qsub error</text>
</g>
<rect x="212" y="402" width="52" height="19" rx="5" fill="#fef9c3" stroke="#ca8a04"/><text x="238.0" y="416" font-size="11" fill="#713f12" text-anchor="middle">config</text>
<rect x="270" y="402" width="82" height="19" rx="5" fill="#e2e8f0" stroke="#64748b"/><text x="311.0" y="416" font-size="11" fill="#334155" text-anchor="middle">job attrs ✎</text>
<rect x="209" y="283" width="144" height="62" rx="6" fill="#ffffff" stroke="#2563eb" stroke-dasharray="4 3"/>
<g font-family="DejaVu Sans Mono, Menlo, monospace" font-size="10.5" fill="#1e3a8a">
<text x="215" y="297">quantum_resources=</text>
<text x="229" y="310">ibm_kingston:2</text>
<text x="281" y="323" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#2563eb">↓ sets</text>
<text x="215" y="338" font-weight="bold">qrmi_ibm_kingston=2</text>
</g>
<rect x="382" y="232" width="96" height="160" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="430" y="258" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Queue</text>
<text x="430" y="276" font-size="13" fill="#334155" text-anchor="middle">(Q)</text>
<g font-size="11" fill="#334155" text-anchor="middle">
<text x="430" y="300">scheduler:</text>
<text x="430" y="315">free slots of</text>
<text x="430" y="330">qrmi_&lt;name&gt;?</text>
<text x="430" y="356">✕ stays in Q</text>
<text x="430" y="371">(no QRMI call)</text>
</g>
<rect x="498" y="165" width="200" height="265" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<circle cx="518" cy="189" r="11" fill="#2563eb"/>
<text x="518" y="194" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="535" y="194" font-size="13.5" font-weight="bold" fill="#1e3a8a">qrmi_check</text>
<text x="510" y="216" font-size="11.5" fill="#1e40af">runjob</text>
<g font-size="12.5" fill="#1e3a8a">
<text x="510" y="246" xml:space="preserve">status(): is each QPU</text>
<text x="510" y="264" xml:space="preserve">ready? (online, healthy,</text>
<text x="510" y="282" xml:space="preserve">not busy, enough slots)</text>
<text x="510" y="306" xml:space="preserve">✓ send the job to a node</text>
<text x="510" y="326" xml:space="preserve">✕ not ready → Q</text>
<text x="510" y="342" xml:space="preserve">  (reason in comment)</text>
<text x="510" y="362" xml:space="preserve">✕ auth error etc. → hold</text>
<text x="510" y="384" xml:space="preserve">sets job info (no secrets)</text>
</g>
<rect x="510" y="402" width="52" height="19" rx="5" fill="#fef9c3" stroke="#ca8a04"/><text x="536.0" y="416" font-size="11" fill="#713f12" text-anchor="middle">config</text>
<rect x="568" y="402" width="82" height="19" rx="5" fill="#e2e8f0" stroke="#64748b"/><text x="609.0" y="416" font-size="11" fill="#334155" text-anchor="middle">job attrs ✎</text>
<rect x="750" y="165" width="170" height="265" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<circle cx="770" cy="189" r="11" fill="#16a34a"/>
<text x="770" y="194" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="787" y="194" font-size="13.5" font-weight="bold" fill="#14532d">qrmi_acquire</text>
<text x="762" y="216" font-size="11.5" fill="#166534">execjob_begin</text>
<g font-size="12.5" fill="#14532d">
<text x="762" y="246" xml:space="preserve">first node only</text>
<text x="762" y="270" xml:space="preserve">status() again, then</text>
<text x="762" y="288" xml:space="preserve">acquire() each QPU</text>
<text x="762" y="306" xml:space="preserve">(N slots), save the</text>
<text x="762" y="324" xml:space="preserve">tokens</text>
<text x="762" y="348" xml:space="preserve">✕ not ready or failed:</text>
<text x="762" y="364" xml:space="preserve">  release what was</text>
<text x="762" y="380" xml:space="preserve">  acquired, reject</text>
</g>
<rect x="762" y="402" width="38" height="19" rx="5" fill="#fef9c3" stroke="#ca8a04"/><text x="781.0" y="416" font-size="11" fill="#713f12" text-anchor="middle">.CF</text>
<rect x="806" y="402" width="66" height="19" rx="5" fill="#ffedd5" stroke="#ea580c"/><text x="839.0" y="416" font-size="11" fill="#7c2d12" text-anchor="middle">tokens ✎</text>
<rect x="940" y="165" width="165" height="265" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<circle cx="960" cy="189" r="11" fill="#16a34a"/>
<text x="960" y="194" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="977" y="194" font-size="13.5" font-weight="bold" fill="#14532d">qrmi_launch</text>
<text x="952" y="216" font-size="11.5" fill="#166534">execjob_launch</text>
<g font-size="12.5" fill="#14532d">
<text x="952" y="246" xml:space="preserve">adds the QRMI</text>
<text x="952" y="264" xml:space="preserve">settings and the</text>
<text x="952" y="282" xml:space="preserve">tokens to the job</text>
<text x="952" y="300" xml:space="preserve">environment</text>
</g>
<rect x="952" y="402" width="38" height="19" rx="5" fill="#fef9c3" stroke="#ca8a04"/><text x="971.0" y="416" font-size="11" fill="#713f12" text-anchor="middle">.CF</text>
<rect x="996" y="402" width="52" height="19" rx="5" fill="#ffedd5" stroke="#ea580c"/><text x="1022.0" y="416" font-size="11" fill="#7c2d12" text-anchor="middle">tokens</text>
<rect x="1125" y="165" width="130" height="265" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
<circle cx="1145" cy="189" r="11" fill="#16a34a"/>
<text x="1145" y="194" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="1162" y="194" font-size="13.5" font-weight="bold" fill="#14532d">job</text>
<text x="1137" y="216" font-size="11.5" fill="#166534">job script</text>
<g font-size="12.5" fill="#14532d">
<text x="1137" y="246" xml:space="preserve">runs QPU jobs</text>
<text x="1137" y="264" xml:space="preserve">through QRMI,</text>
<text x="1137" y="282" xml:space="preserve">using the</text>
<text x="1137" y="300" xml:space="preserve">settings in its</text>
<text x="1137" y="318" xml:space="preserve">environment</text>
</g>
<rect x="1275" y="165" width="190" height="265" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<circle cx="1295" cy="189" r="11" fill="#16a34a"/>
<text x="1295" y="194" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<text x="1312" y="194" font-size="13.5" font-weight="bold" fill="#14532d">qrmi_release</text>
<text x="1287" y="216" font-size="11.5" fill="#166534">execjob_end</text>
<g font-size="12.5" fill="#14532d">
<text x="1287" y="246" xml:space="preserve">first node only,</text>
<text x="1287" y="264" xml:space="preserve">also when the job</text>
<text x="1287" y="282" xml:space="preserve">is deleted (qdel)</text>
<text x="1287" y="310" xml:space="preserve">release() each QPU</text>
<text x="1287" y="328" xml:space="preserve">and delete the</text>
<text x="1287" y="346" xml:space="preserve">token file</text>
</g>
<rect x="1287" y="402" width="38" height="19" rx="5" fill="#fef9c3" stroke="#ca8a04"/><text x="1306.0" y="416" font-size="11" fill="#713f12" text-anchor="middle">.CF</text>
<rect x="1331" y="402" width="66" height="19" rx="5" fill="#ffedd5" stroke="#ea580c"/><text x="1364.0" y="416" font-size="11" fill="#7c2d12" text-anchor="middle">tokens ✕</text>
<!-- Job flow -->
<g stroke="#4b5563" stroke-width="1.8" fill="none" marker-end="url(#arr)">
<line x1="362" y1="315" x2="379" y2="315"/>
<line x1="478" y1="315" x2="495" y2="315"/>
<line x1="698" y1="315" x2="747" y2="315"/>
<line x1="920" y1="315" x2="937" y2="315"/>
<line x1="1105" y1="315" x2="1122" y2="315"/>
<line x1="1255" y1="315" x2="1272" y2="315"/>
</g>

<!-- Retry loops -->
<path d="M598,432 V452 H448 V396" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrRetry)"/>
<text x="590" y="466" font-size="12" fill="#c2410c" text-anchor="middle">QPU not ready → back to Q,</text>
<text x="590" y="480" font-size="12" fill="#c2410c" text-anchor="middle">retried at the next scheduling cycle</text>
<path d="M835,432 V492 H410 V396" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrRetry)"/>
<text x="550" y="508" font-size="12" fill="#c2410c" text-anchor="middle">QPU not ready or taken after the check → back to Q</text>

<!-- QRMI API calls -->
<g stroke="#7c3aed" stroke-width="1.8" fill="none">
<line x1="330" y1="163" x2="330" y2="88" marker-end="url(#arrApi)"/>
<line x1="648" y1="163" x2="648" y2="88" marker-end="url(#arrApi)"/>
<line x1="860" y1="163" x2="860" y2="88" marker-end="url(#arrApi)"/>
<line x1="1190" y1="163" x2="1190" y2="88" marker-start="url(#arrApi)" marker-end="url(#arrApi)"/>
<line x1="1370" y1="163" x2="1370" y2="88" marker-end="url(#arrApi)"/>
</g>
<g font-size="12" fill="#6d28d9">
<text x="336" y="130">status()</text>
<text x="654" y="130">status()</text>
<text x="866" y="130">status(), acquire()</text>
<text x="1196" y="130">QPU jobs</text>
<text x="1376" y="130">release()</text>
</g>

<!-- Files and attributes -->
<text x="180" y="550" font-size="14" font-weight="bold" fill="#334155">Where the settings, limits and tokens are kept</text>

<rect x="180" y="562" width="470" height="80" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
<rect x="194" y="574" width="52" height="19" rx="5" fill="#fef9c3" stroke="#ca8a04"/><text x="220.0" y="588" font-size="11" fill="#713f12" text-anchor="middle">config</text>
<text x="256" y="589" font-size="14" font-weight="bold" fill="#713f12">server_priv/qrmi_config.json</text>
<text x="194" y="616" font-size="12.5" fill="#713f12">QRMI settings of each QPU, including API keys</text>
<text x="194" y="633" font-size="12.5" fill="#713f12">on pbs-server · readable by root only (600)</text>
<line x1="650" y1="602" x2="727" y2="602" stroke="#ca8a04" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="689" y="591" font-size="11" fill="#713f12" text-anchor="middle">distributed</text>
<text x="689" y="620" font-size="11" fill="#713f12" text-anchor="middle">by the server</text>
<rect x="730" y="562" width="360" height="80" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
<rect x="744" y="574" width="38" height="19" rx="5" fill="#fef9c3" stroke="#ca8a04"/><text x="763.0" y="588" font-size="11" fill="#713f12" text-anchor="middle">.CF</text>
<text x="792" y="589" font-size="14" font-weight="bold" fill="#713f12">mom_priv/hooks/qrmi_*.CF</text>
<text x="744" y="616" font-size="12.5" fill="#713f12">hook configuration files (copies of it)</text>
<text x="744" y="633" font-size="12.5" fill="#713f12">on the compute nodes · root only</text>
<rect x="1110" y="562" width="370" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<rect x="1124" y="574" width="52" height="19" rx="5" fill="#ffedd5" stroke="#ea580c"/><text x="1150.0" y="588" font-size="11" fill="#7c2d12" text-anchor="middle">tokens</text>
<text x="1186" y="589" font-size="14" font-weight="bold" fill="#7c2d12">mom_priv/qrmi/&lt;job id&gt;.json</text>
<text x="1124" y="616" font-size="12.5" fill="#7c2d12">acquisition tokens of the running job</text>
<text x="1124" y="633" font-size="12.5" fill="#7c2d12">on the first node · root only (600)</text>

<rect x="180" y="658" width="700" height="96" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<rect x="194" y="670" width="70" height="19" rx="5" fill="#e2e8f0" stroke="#64748b"/><text x="229.0" y="684" font-size="11" fill="#334155" text-anchor="middle">job attrs</text>
<text x="274" y="685" font-size="14" font-weight="bold" fill="#1e293b">Job attributes · visible with qstat -f · no API keys, no tokens</text>
<g font-size="12.5" fill="#334155">
<text x="194" y="710">Resource_List: qrmi_&lt;name&gt; = N (slots, set by qrmi_validate)</text>
<text x="194" y="728">Variable_List: QRMI_JOB_QPU_RESOURCES, QRMI_JOB_QPU_TYPES, QRMI_LIST_DELIMITER,</text>
<text x="194" y="745">  &lt;name&gt;_QRMI_JOB_QPU_SLOTS, &lt;name&gt;_QRMI_JOB_TIMEOUT_SECONDS (set by qrmi_check)</text>
</g>

<rect x="900" y="658" width="580" height="96" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<rect x="914" y="670" width="44" height="19" rx="5" fill="#e0e7ff" stroke="#4f46e5"/><text x="936.0" y="684" font-size="11" fill="#312e81" text-anchor="middle">limit</text>
<text x="968" y="685" font-size="14" font-weight="bold" fill="#312e81">server resources_available.qrmi_&lt;name&gt;</text>
<g font-size="12.5" fill="#312e81">
<text x="914" y="710">slots of each QPU in the whole cluster: max_slots, or 1 if the QPU</text>
<text x="914" y="728">has no slots · set by the administrator with qmgr</text>
<text x="914" y="745">used by the scheduler and by qrmi_validate (N > limit → qsub error)</text>
</g>

<rect x="180" y="770" width="1300" height="82" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="194" y="796" font-size="14" font-weight="bold" fill="#991b1b">Compute nodes: $logevent 0xff, mom_logs root only</text>
<text x="194" y="820" font-size="12.5" fill="#991b1b">pbs_mom would otherwise write the job environment changed by qrmi_launch (with API keys and tokens) to mom_logs (event class 0x0100).</text>
<text x="194" y="838" font-size="12.5" fill="#991b1b">The debug messages of the hooks use event class 0x0400 (off by default): to see them, use $logevent 0x4ff, never a value that includes 0x0100.</text>

<!-- Legend -->
<g font-size="12" fill="#475569">
<line x1="180" y1="896" x2="220" y2="896" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="228" y="900">job flow</text>
<line x1="310" y1="896" x2="350" y2="896" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrRetry)"/>
<text x="358" y="900">job goes back to the queue</text>
<line x1="560" y1="896" x2="600" y2="896" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrApi)"/>
<text x="608" y="900">QRMI API call</text>
<rect x="720" y="887" width="52" height="19" rx="5" fill="#fef9c3" stroke="#ca8a04"/><text x="746.0" y="901" font-size="11" fill="#713f12" text-anchor="middle">config</text>
<text x="780" y="900">files and attributes used by each hook (✎ writes, ✕ deletes; otherwise reads)</text>
</g>
</svg>