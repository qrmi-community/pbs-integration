<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrRetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrApi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="800" fill="#ffffff"/>

  <!-- ===== Quantum service ===== -->
  <rect x="180" y="22" width="1300" height="62" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="200" y="59" font-size="17" font-weight="bold" fill="#4c1d95">Quantum Resources</text>
  <text x="400" y="59" font-size="14" fill="#5b21b6">(e.g. IBM Quantum)  ·  accessed through QRMI with the settings in qrmi_config.json</text>

  <!-- ===== Regions ===== -->
  <rect x="180" y="110" width="530" height="372" rx="12" fill="#f8fbff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="196" y="138" font-size="16" font-weight="bold" fill="#1e3a8a">pbs-server</text>

  <rect x="730" y="110" width="750" height="372" rx="12" fill="#f7fdf9" stroke="#86efac" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1466" y="472" font-size="16" font-weight="bold" fill="#14532d" text-anchor="end">first compute node of the job (e.g. pbs-node1)</text>

  <!-- ===== User ===== -->
  <circle cx="80" cy="290" r="16" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <path d="M50,344 Q80,306 110,344 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="80" y="368" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">User</text>
  <line x1="114" y1="315" x2="196" y2="315" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="155" y="305" font-size="13" fill="#475569" text-anchor="middle">qsub</text>

  <!-- ===== 1 qrmi_validate ===== -->
  <rect x="200" y="165" width="150" height="235" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="220" cy="189" r="11" fill="#2563eb"/>
  <text x="220" y="194" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="237" y="194" font-size="13.5" font-weight="bold" fill="#1e3a8a">qrmi_validate</text>
  <text x="212" y="216" font-size="11.5" fill="#1e40af">queuejob, modifyjob</text>
  <g font-size="12.5" fill="#1e3a8a">
    <text x="212" y="248">At qsub / qalter:</text>
    <text x="212" y="266">names, types and</text>
    <text x="212" y="284">status() of each</text>
    <text x="212" y="302">QPU</text>
    <text x="212" y="322">✕ invalid, or</text>
    <text x="212" y="338">  auth error etc.</text>
    <text x="212" y="354">  → qsub error</text>
  </g>
  <rect x="212" y="372" width="52" height="19" rx="5" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="238" y="386" font-size="11" fill="#713f12" text-anchor="middle">config</text>

  <!-- ===== Queue ===== -->
  <rect x="372" y="265" width="96" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="420" y="310" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Queue</text>
  <text x="420" y="330" font-size="13" fill="#334155" text-anchor="middle">(Q)</text>

  <!-- ===== 2 qrmi_check ===== -->
  <rect x="490" y="165" width="200" height="235" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="510" cy="189" r="11" fill="#2563eb"/>
  <text x="510" y="194" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="527" y="194" font-size="13.5" font-weight="bold" fill="#1e3a8a">qrmi_check</text>
  <text x="502" y="216" font-size="11.5" fill="#1e40af">runjob</text>
  <g font-size="12.5" fill="#1e3a8a">
    <text x="502" y="248">status() of each QPU:</text>
    <text x="502" y="266">online and not busy?</text>
    <text x="502" y="292">✓ send the job to a node</text>
    <text x="502" y="310">✕ busy, offline → queue</text>
    <text x="502" y="328">✕ auth error etc. → hold</text>
    <text x="502" y="354">sets job info (no secrets)</text>
  </g>
  <rect x="502" y="372" width="52" height="19" rx="5" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="528" y="386" font-size="11" fill="#713f12" text-anchor="middle">config</text>
  <rect x="560" y="372" width="82" height="19" rx="5" fill="#e2e8f0" stroke="#64748b"/>
  <text x="601" y="386" font-size="11" fill="#334155" text-anchor="middle">job attrs ✎</text>

  <!-- ===== 3 qrmi_acquire ===== -->
  <rect x="750" y="165" width="170" height="235" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="770" cy="189" r="11" fill="#16a34a"/>
  <text x="770" y="194" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="787" y="194" font-size="13.5" font-weight="bold" fill="#14532d">qrmi_acquire</text>
  <text x="762" y="216" font-size="11.5" fill="#166534">execjob_begin</text>
  <g font-size="12.5" fill="#14532d">
    <text x="762" y="248">first node only</text>
    <text x="762" y="276">acquire() each QPU</text>
    <text x="762" y="294">and save the tokens</text>
    <text x="762" y="322">✕ release what was</text>
    <text x="762" y="340">  acquired, reject</text>
  </g>
  <rect x="762" y="372" width="38" height="19" rx="5" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="781" y="386" font-size="11" fill="#713f12" text-anchor="middle">.CF</text>
  <rect x="806" y="372" width="66" height="19" rx="5" fill="#ffedd5" stroke="#ea580c"/>
  <text x="839" y="386" font-size="11" fill="#7c2d12" text-anchor="middle">tokens ✎</text>

  <!-- ===== 4 qrmi_launch ===== -->
  <rect x="940" y="165" width="165" height="235" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="960" cy="189" r="11" fill="#16a34a"/>
  <text x="960" y="194" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="977" y="194" font-size="13.5" font-weight="bold" fill="#14532d">qrmi_launch</text>
  <text x="952" y="216" font-size="11.5" fill="#166534">execjob_launch</text>
  <g font-size="12.5" fill="#14532d">
    <text x="952" y="248">adds the QRMI</text>
    <text x="952" y="266">settings and the</text>
    <text x="952" y="284">tokens to the job</text>
    <text x="952" y="302">environment</text>
  </g>
  <rect x="952" y="372" width="38" height="19" rx="5" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="971" y="386" font-size="11" fill="#713f12" text-anchor="middle">.CF</text>
  <rect x="996" y="372" width="52" height="19" rx="5" fill="#ffedd5" stroke="#ea580c"/>
  <text x="1022" y="386" font-size="11" fill="#7c2d12" text-anchor="middle">tokens</text>

  <!-- ===== 5 job ===== -->
  <rect x="1125" y="165" width="130" height="235" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="1145" cy="189" r="11" fill="#16a34a"/>
  <text x="1145" y="194" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="1162" y="194" font-size="13.5" font-weight="bold" fill="#14532d">job</text>
  <text x="1137" y="216" font-size="11.5" fill="#166534">job script</text>
  <g font-size="12.5" fill="#14532d">
    <text x="1137" y="248">runs QPU jobs</text>
    <text x="1137" y="266">through QRMI,</text>
    <text x="1137" y="284">using the</text>
    <text x="1137" y="302">settings in its</text>
    <text x="1137" y="320">environment</text>
  </g>

  <!-- ===== 6 qrmi_release ===== -->
  <rect x="1275" y="165" width="190" height="235" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="1295" cy="189" r="11" fill="#16a34a"/>
  <text x="1295" y="194" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="1312" y="194" font-size="13.5" font-weight="bold" fill="#14532d">qrmi_release</text>
  <text x="1287" y="216" font-size="11.5" fill="#166534">execjob_end</text>
  <g font-size="12.5" fill="#14532d">
    <text x="1287" y="248">first node only,</text>
    <text x="1287" y="266">also when the job</text>
    <text x="1287" y="284">is deleted (qdel)</text>
    <text x="1287" y="312">release() each QPU</text>
    <text x="1287" y="330">and delete the</text>
    <text x="1287" y="348">token file</text>
  </g>
  <rect x="1287" y="372" width="38" height="19" rx="5" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="1306" y="386" font-size="11" fill="#713f12" text-anchor="middle">.CF</text>
  <rect x="1331" y="372" width="66" height="19" rx="5" fill="#ffedd5" stroke="#ea580c"/>
  <text x="1364" y="386" font-size="11" fill="#7c2d12" text-anchor="middle">tokens ✕</text>

  <!-- ===== Job flow ===== -->
  <g stroke="#4b5563" stroke-width="1.8" fill="none" marker-end="url(#arr)">
    <line x1="350" y1="315" x2="369" y2="315"/>
    <line x1="468" y1="315" x2="487" y2="315"/>
    <line x1="690" y1="315" x2="747" y2="315"/>
    <line x1="920" y1="315" x2="937" y2="315"/>
    <line x1="1105" y1="315" x2="1122" y2="315"/>
    <line x1="1255" y1="315" x2="1272" y2="315"/>
  </g>

  <!-- ===== Retry loops ===== -->
  <path d="M590,402 V425 H440 V369" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrRetry)"/>
  <text x="600" y="440" font-size="12" fill="#c2410c" text-anchor="middle">not available → wait in the queue</text>
  <path d="M835,402 V456 H402 V369" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrRetry)"/>
  <text x="560" y="473" font-size="12" fill="#c2410c" text-anchor="middle">acquire failed (taken after the check) → retried later</text>

  <!-- ===== QRMI API calls ===== -->
  <g stroke="#7c3aed" stroke-width="1.8" fill="none">
    <line x1="320" y1="163" x2="320" y2="88" marker-end="url(#arrApi)"/>
    <line x1="640" y1="163" x2="640" y2="88" marker-end="url(#arrApi)"/>
    <line x1="860" y1="163" x2="860" y2="88" marker-end="url(#arrApi)"/>
    <line x1="1190" y1="163" x2="1190" y2="88" marker-start="url(#arrApi)" marker-end="url(#arrApi)"/>
    <line x1="1370" y1="163" x2="1370" y2="88" marker-end="url(#arrApi)"/>
  </g>
  <g font-size="12" fill="#6d28d9">
    <text x="326" y="130">status()</text>
    <text x="646" y="130">status()</text>
    <text x="866" y="130">acquire()</text>
    <text x="1196" y="130">QPU jobs</text>
    <text x="1376" y="130">release()</text>
  </g>

  <!-- ===== Files and attributes ===== -->
  <text x="180" y="512" font-size="14" font-weight="bold" fill="#334155">Where the settings and tokens are kept</text>

  <rect x="180" y="524" width="470" height="80" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <rect x="194" y="536" width="52" height="19" rx="5" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="220" y="550" font-size="11" fill="#713f12" text-anchor="middle">config</text>
  <text x="256" y="551" font-size="14" font-weight="bold" fill="#713f12">server_priv/qrmi_config.json</text>
  <text x="194" y="578" font-size="12.5" fill="#713f12">QRMI settings of each QPU, including API keys</text>
  <text x="194" y="595" font-size="12.5" fill="#713f12">on pbs-server · readable by root only (600)</text>

  <line x1="650" y1="564" x2="727" y2="564" stroke="#ca8a04" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="689" y="553" font-size="11" fill="#713f12" text-anchor="middle">distributed</text>
  <text x="689" y="582" font-size="11" fill="#713f12" text-anchor="middle">by the server</text>

  <rect x="730" y="524" width="360" height="80" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <rect x="744" y="536" width="38" height="19" rx="5" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="763" y="550" font-size="11" fill="#713f12" text-anchor="middle">.CF</text>
  <text x="792" y="551" font-size="14" font-weight="bold" fill="#713f12">mom_priv/hooks/qrmi_*.CF</text>
  <text x="744" y="578" font-size="12.5" fill="#713f12">hook configuration files (copies of it)</text>
  <text x="744" y="595" font-size="12.5" fill="#713f12">on the compute nodes · root only</text>

  <rect x="1110" y="524" width="370" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="1124" y="536" width="52" height="19" rx="5" fill="#ffedd5" stroke="#ea580c"/>
  <text x="1150" y="550" font-size="11" fill="#7c2d12" text-anchor="middle">tokens</text>
  <text x="1186" y="551" font-size="14" font-weight="bold" fill="#7c2d12">mom_priv/qrmi/&lt;job id&gt;.json</text>
  <text x="1124" y="578" font-size="12.5" fill="#7c2d12">acquisition tokens of the running job</text>
  <text x="1124" y="595" font-size="12.5" fill="#7c2d12">on the first node · root only (600)</text>

  <rect x="180" y="620" width="700" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <rect x="194" y="632" width="70" height="19" rx="5" fill="#e2e8f0" stroke="#64748b"/>
  <text x="229" y="646" font-size="11" fill="#334155" text-anchor="middle">job attrs</text>
  <text x="274" y="647" font-size="14" font-weight="bold" fill="#1e293b">Job attributes (Variable_List) · visible with qstat -f</text>
  <text x="194" y="674" font-size="12.5" fill="#334155">QRMI_JOB_QPU_RESOURCES, QRMI_JOB_QPU_TYPES, QRMI_LIST_DELIMITER,</text>
  <text x="194" y="691" font-size="12.5" fill="#334155">&lt;name&gt;_QRMI_JOB_TIMEOUT_SECONDS only  ·  no API keys, no tokens</text>

  <rect x="900" y="620" width="580" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="914" y="647" font-size="14" font-weight="bold" fill="#991b1b">Compute nodes: $logevent 0xff, mom_logs root only</text>
  <text x="914" y="674" font-size="12.5" fill="#991b1b">pbs_mom would otherwise write the job environment changed</text>
  <text x="914" y="691" font-size="12.5" fill="#991b1b">by qrmi_launch (with API keys and tokens) to mom_logs</text>

  <!-- ===== Legend ===== -->
  <g font-size="12" fill="#475569">
    <line x1="180" y1="742" x2="220" y2="742" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="228" y="746">job flow</text>
    <line x1="310" y1="742" x2="350" y2="742" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrRetry)"/>
    <text x="358" y="746">job goes back to the queue</text>
    <line x1="560" y1="742" x2="600" y2="742" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrApi)"/>
    <text x="608" y="746">QRMI API call</text>
    <rect x="720" y="733" width="52" height="19" rx="5" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="746" y="747" font-size="11" fill="#713f12" text-anchor="middle">config</text>
    <text x="780" y="746">files and attributes used by each hook (✎ writes, ✕ deletes; otherwise reads)</text>
  </g>
</svg>
